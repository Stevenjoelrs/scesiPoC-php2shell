; php2shell lab settings -- mirrors 9bie/php2shell-bypass-aslr-exp archive/legacy-8m.
;
; These values are mounted into the *official* php:8.4.26/8.4.27-apache images,
; so both lab targets share an identical configuration and differ only in the
; PHP patch level.
;
; memory_limit=8M is what turns the upload-progress/engine bug into a
; controllable heap primitive: it forces the request into the OOM path while
; the session upload-progress buffer is still reachable.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 8M
post_max_size = 64M
upload_max_filesize = 64M

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On

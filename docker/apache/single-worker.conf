# php2shell lab -- single prefork worker.
#
# Mirrors 9bie/php2shell-bypass-aslr-exp pure/docker/apache-single-worker.conf.
# Loaded from /etc/apache2/conf-enabled/ *after* mods-enabled, so these values
# override the distro defaults in mods-enabled/mpm_prefork.conf.
#
# Why it matters: with one persistent worker, every request runs in the same
# process, so the heap/ASLR state groomed by earlier requests is still valid
# when the exploit request arrives.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>

[project]
name = "php2shell-poc"
version = "0.1.0"
description = "Lab-only PoC for CVE-2026-109618 / CVE-2026-109619 (PHP2Shell)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Steven Joel" }]
dependencies = []

[project.scripts]
php2shell = "poc.cli:main"

[tool.setuptools]
packages = ["poc"]

[tool.ruff]
target-version = "py39"
line-length = 100
